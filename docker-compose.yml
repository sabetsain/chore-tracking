services:
  db:
    image: postgres:16-alpine
    container_name: chores-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chores}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chores_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chores_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chores -d chores_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chores-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chores}:${POSTGRES_PASSWORD:-chores_secret}@db:5432/${POSTGRES_DB:-chores_db}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_change_in_production}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL:-admin@chores.local}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chores-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
